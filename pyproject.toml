[project]
name = "index-Y"
version = "1.0.0"
description = "禁书目录 X 系列的 AI 校对版。"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "regex>=2025.11.3",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "ty>=0.0.3",
]

# index-X 是上游仓库的 submodule，其内容不入本仓 lint/type 范围
[tool.ruff]
extend-exclude = ["index-X"]

[tool.ty.src]
exclude = ["index-X"]

[tool.ty.environment]
# 脚本运行时把 index-X/tools 挂进 sys.path 复用上游公开库（alignment_rules 等）
extra-paths = ["index-X/tools"]
