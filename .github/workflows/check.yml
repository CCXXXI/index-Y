name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  x2y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
      - run: uv run python scripts/sync/x2y.py
      - name: Y == x2y(X, rules)
        run: |
          dirty=$(git status --porcelain -- Y)
          if [ -n "$dirty" ]; then
            echo "::error::Y/ 与 x2y(X, rules) 不一致——重跑 uv run python scripts/sync/x2y.py 并提交"
            echo "$dirty"
            exit 1
          fi
